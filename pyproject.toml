[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-image-cache"
version = "0.1.0"
description = "Serve image bytes for an origin URL from local indexes, or fetch and store a miss."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
origin-image-cache = "origin_image_cache.cli:main"

[project.urls]
Repository = "https://github.com/kolpacksoftware/origin-image-cache"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
